name: Verify action pins

# Reusable wrapper around verify-action-pins/action.yml, so a consuming repo can
# adopt the check with a three-line caller instead of a checkout + action pair:
#
#   jobs:
#     action-pins:
#       uses: workos/renovate-config/.github/workflows/verify-action-pins.yml@main
#
# Called on pull_request it reports as a normal status check, which is what makes
# it usable as a required check and as an automerge gate: Renovate will not merge
# a branch whose statuses are not green, so a pin whose release is younger than
# `min-age-days` cannot land — and it turns green on its own once the release
# ages, with no human step.

on:
  workflow_call:
    inputs:
      paths:
        type: string
        required: false
        default: ".github"
      base:
        description: >-
          Ref to diff against. Defaults to the PR base on pull_request events and
          to empty (full scan) elsewhere.
        type: string
        required: false
        default: ""
      min-age-days:
        type: string
        required: false
        default: "7"
      allowlist:
        type: string
        required: false
        default: ".github/action-pin-allowlist.yml"
      checker-ref:
        description: >-
          Ref of workos/renovate-config to run the checker from. Defaults to
          `github.job_workflow_sha`, the commit of this workflow file itself, so
          the implementation always matches the revision the caller asked for —
          pin this workflow to a SHA and the checker runs from that same SHA.
          Only set this to run a different revision on purpose.
        type: string
        required: false
        default: ""
      require-immutable:
        type: string
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          # A PR-scoped run resolves `git merge-base HEAD <base>`, which needs
          # history rather than the default single commit.
          fetch-depth: 0

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          repository: workos/renovate-config
          # The checker code must come from the same revision as this workflow
          # file, or a caller writing `...@<sha>` would still execute whatever
          # main holds — a change here running with the caller's token before
          # anyone pinning a SHA had reviewed it. `job_workflow_sha` is the
          # commit of the reusable workflow itself, which is exactly that
          # revision; `main` is only a fallback for a runner that omits it.
          ref: ${{ inputs.checker-ref || github.job_workflow_sha || 'main' }}
          path: .verify-action-pins
          persist-credentials: false

      - uses: ./.verify-action-pins/verify-action-pins
        with:
          paths: ${{ inputs.paths }}
          base: ${{ inputs.base || (github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '') }}
          min-age-days: ${{ inputs.min-age-days }}
          allowlist: ${{ inputs.allowlist }}
          require-immutable: ${{ inputs.require-immutable }}
          token: ${{ github.token }}
