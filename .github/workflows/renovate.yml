name: Self-hosted Renovate

on:
  schedule:
    # Fire hourly, on the hour. GitHub Actions cron is UTC-only and not
    # DST-aware, so we do NOT try to encode the after-hours window here.
    # Instead, Renovate's own `schedule` in default.json
    # ("America/New_York" weekday nights 21:00-07:00 + weekends) is the
    # authoritative, timezone-aware gate: runs that fire outside that
    # window discover no in-schedule work and exit almost immediately.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry-run mode: 'full' logs what would happen without changes, 'lookup' creates branches but not PRs, empty string runs normally."
        type: choice
        options:
          - ""
          - full
          - lookup
        default: ""
      log-level:
        description: "Renovate log level"
        type: choice
        options:
          - info
          - debug
        default: info

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Hard ceiling: the GitHub App installation token minted below expires
    # after 60 minutes, so a longer run could not push or update PRs
    # anyway. Never raise this above 60.
    timeout-minutes: 60
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        id: app-token
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: workos
          repositories: workos

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Write Socket Firewall .npmrc for postUpgradeTasks
        env:
          TOKEN: ${{ secrets.SOCKET_FIREWALL_TOKEN }}
        run: |
          # postUpgradeTasks run `rush update` inside the Renovate
          # container. Rush's pnpm bootstrap spawns npm in a way that does
          # NOT honor NPM_CONFIG_REGISTRY from the environment (npm falls
          # through to its compile-time default of registry.npmjs.org), so
          # an on-disk ~/.npmrc is the only mechanism that actually routes
          # lockfile resolution through the Socket Firewall. Same approach
          # as workos/workos .github/actions/check-socket-firewall-token.
          # The file is bind-mounted into the container's HOME below.
          # ignore-scripts: Renovate injects git credentials — including
          # the GitHub App installation token — into every postUpgradeTasks
          # child env (GIT_CONFIG_KEY/VALUE_*), which package lifecycle
          # scripts would inherit. Disabling scripts means no third-party
          # install code runs in-container at all. Lockfile output is
          # unaffected: resolution doesn't run scripts, and pnpm's
          # ignore-scripts does NOT disable .pnpmfile.cjs, so rush's
          # pnpmfile shim still runs.
          mkdir -p /tmp/renovate-home
          {
            echo "registry=https://socket-firewall.workos.dev/"
            echo "//socket-firewall.workos.dev/:_authToken=${TOKEN}"
            echo "ignore-scripts=true"
          } > /tmp/renovate-home/.npmrc
          # The container user (uid 12021) differs from the runner user;
          # the file must be world-readable across the bind mount.
          chmod 644 /tmp/renovate-home/.npmrc

      - uses: renovatebot/github-action@6d859fc95779be83a0335ca704879b47e5d79641  # v46.1.16
        with:
          configurationFile: .github/renovate-global-config.js
          token: ${{ steps.app-token.outputs.token }}
          # Setting docker-volumes REPLACES the action's default value
          # (/tmp:/tmp) rather than appending to it, so /tmp:/tmp is
          # restated to keep Renovate's baseDir/cache under /tmp behaving
          # as stock. (The config file is unaffected — the action mounts
          # it separately at /github-action/.) The second mount drops the
          # Socket Firewall .npmrc into the container user's HOME, where
          # npm/pnpm spawned by postUpgradeTasks read it.
          docker-volumes: "/tmp:/tmp;/tmp/renovate-home/.npmrc:/home/ubuntu/.npmrc"
          # Extend the default env-regex to forward Socket Firewall vars
          # into the Docker container. Default only matches RENOVATE_*,
          # LOG_LEVEL, GITHUB_COM_TOKEN, NODE_OPTIONS, and proxy vars.
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy|NPM_CONFIG_REGISTRY|SOCKET_FIREWALL_TOKEN)$"
        env:
          RENOVATE_DRY_RUN: ${{ inputs.dry-run }}
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # Socket Firewall: postUpgradeTasks (rush update) needs these
          # to route npm installs through the firewall, matching the
          # env that renovate-lockfile-update.yml previously provided.
          NPM_CONFIG_REGISTRY: https://socket-firewall.workos.dev/
          SOCKET_FIREWALL_TOKEN: ${{ secrets.SOCKET_FIREWALL_TOKEN }}
